<style>
/* layout: single centred column on quantum night; name, thesis, three platform rows, field-knot divider, keyword line */
:root{
  --night:#091625; --night-2:#0f2236; --bone:#F1E8D6; --bone-dim:rgba(241,232,214,.68);
  --agni:#DA8835; --jal:#5AAFD0; --quantum:#4FCAD7; --line:rgba(241,232,214,.14);
  --display:"Anton",Impact,"Arial Narrow Bold",sans-serif;
  --body:"Karla",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--night);color:var(--bone)}
body{font-family:var(--body);font-size:16px;line-height:1.5;padding-inline:16px;padding-block:48px 40px;min-height:100%}
main{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
header{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.mark{width:96px;height:96px;border-radius:50%;object-fit:cover;display:block}
.name{font-family:var(--display);font-weight:400;font-size:clamp(44px,13vw,60px);line-height:1;letter-spacing:.01em;margin:0}
.name .a{color:var(--jal)} .name .w{color:var(--agni)}
.handle{font-size:14px;letter-spacing:.06em;color:var(--bone-dim)}
.thesis{font-family:var(--display);font-size:22px;line-height:1.15;text-transform:lowercase;margin:6px 0 0;text-wrap:balance}
.pillars{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--bone-dim);margin:0}
.knot{display:block;width:120px;height:28px;margin:0 auto}
nav{display:flex;flex-direction:column;gap:28px}
.group{display:flex;flex-direction:column;gap:12px}
.group h2{font-family:var(--body);font-weight:700;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--bone-dim);margin:0 0 2px 4px}
a.row{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--night-2);color:var(--bone);text-decoration:none;transition:border-color .2s,transform .2s}
a.row:hover{border-color:var(--agni);transform:translateY(-1px)}
a.row:focus-visible{outline:2px solid var(--quantum);outline-offset:3px}
.ico{width:44px;height:44px;border-radius:11px;display:grid;place-items:center;background:rgba(241,232,214,.06)}
.ico svg{width:24px;height:24px;fill:var(--bone)}
.txt{min-width:0;display:flex;flex-direction:column}
.plat{font-weight:700;font-size:17px}
.sub{font-size:13px;color:var(--bone-dim);overflow-wrap:anywhere}
.arr{font-family:var(--display);font-size:20px;color:var(--agni)}
.cta{text-align:center;display:flex;flex-direction:column;gap:6px}
.cta p{margin:0}
.kw{font-family:var(--display);font-size:24px;text-transform:lowercase}
.kw b{font-weight:400;color:var(--agni)} .kw i{font-style:normal;color:var(--jal)}
.close{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--bone-dim)}
@media (prefers-reduced-motion:reduce){a.row{transition:none}a.row:hover{transform:none}}
</style>
</head>
